; RayGLow ESP32 microphone feature-sender.
; Emits the identical v1 UDP packet as ../sender.py, sourced from an I2S mic.
;
; pioarduino platform (community fork) = Arduino-ESP32 3.x / ESP-IDF 5.x, which
; gives the modern `driver/i2s_std.h` API that is identical on the WROOM and the
; S3. The official PlatformIO `espressif32` platform still ships Arduino 2.x /
; IDF 4.4 (legacy `driver/i2s.h`), so we pin pioarduino instead.
;
; I2S pins are set per-board here via build_flags (config.h supplies them only as
; #ifndef fallbacks), so the same source builds for either board unchanged.

[platformio]
default_envs = s3zero

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; config.h (WiFi creds + Pi host) is gitignored; copy config.example.h to it.

; --- Primary target: Waveshare ESP32-S3-Zero (native USB, INMP441) ----------
; Board manifest already sets ARDUINO_USB_MODE=1 + BOARD_HAS_PSRAM + 4MB flash.
; We add USB_CDC_ON_BOOT so Serial goes to the USB-C cable (else it lands on
; UART0/GPIO43-44). Pins: SD->IO4, SCK->IO5, WS->IO6 (all safe header GPIOs;
; IO19/20=USB, IO21=onboard RGB LED, IO0/3/45/46=strapping — all avoided).
[env:s3zero]
board = waveshare_esp32_s3_zero
; esp-dsp: the precompiled libespressif__esp-dsp.a + headers already ship inside
; framework-arduinoespressif32-libs, so we just add its include dirs and link it
; (no lib_deps / IDF component needed). USE_ESP_DSP switches fft.cpp to the SIMD
; backend; the WROOM env keeps the scalar one.
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D I2S_BCLK_PIN=5
  -D I2S_WS_PIN=6
  -D I2S_DIN_PIN=4
  -D USE_ESP_DSP
  -I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/espressif__esp-dsp/modules/fft/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/espressif__esp-dsp/modules/common/include
  -L ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/lib
  -lespressif__esp-dsp

; --- ESP-NOW transport on the S3-Zero (production link to the C3 dongle) -----
; Same board/flags as s3zero, plus TRANSPORT_ESPNOW to swap net_udp -> net_espnow.
; No OTA in this build (flash via USB-C); set DONGLE_MAC + ESPNOW_CHANNEL in config.h.
[env:s3zero-espnow]
extends = env:s3zero
build_flags =
  ${env:s3zero.build_flags}
  -D TRANSPORT_ESPNOW

; --- Interim dev board: ESP32-WROOM-32 (CP210x UART) ------------------------
[env:esp32dev]
board = esp32dev
upload_speed = 921600
build_flags =
  -D I2S_BCLK_PIN=14
  -D I2S_WS_PIN=15
  -D I2S_DIN_PIN=32

; --- OTA variants: after the first USB flash, reflash over WiFi -------------
;   RAYGLOW_MIC_IP=<device-ip> RAYGLOW_MIC_OTA_PASS=<pass> \
;     ~/.local/bin/pio run -e s3zero-ota -t upload
[env:s3zero-ota]
extends = env:s3zero
upload_protocol = espota
upload_port = ${sysenv.RAYGLOW_MIC_IP}
upload_flags = --auth=${sysenv.RAYGLOW_MIC_OTA_PASS}

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.RAYGLOW_MIC_IP}
upload_flags = --auth=${sysenv.RAYGLOW_MIC_OTA_PASS}
