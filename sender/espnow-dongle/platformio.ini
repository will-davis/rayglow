; RayGLow ESP-NOW receiver dongle (Seeed Studio XIAO ESP32-C3).
;
; Lives inside the Pi case. Receives v1 feature packets over ESP-NOW from the S3
; mic and relays them verbatim to the Pi over UART (dongle D6/GPIO21 TX -> a
; spare Pi UART RX). No WiFi association, no secrets - pure ESP-NOW on a fixed
; channel that must match the mic (ESPNOW_CHANNEL in src/main.cpp).
;
; Native USB (no UART bridge): flash + serial console ride the C3's built-in USB
; (enumerates as /dev/ttyACM*). The board manifest already sets USB_MODE=1 +
; CDC_ON_BOOT=1, so Serial goes to the USB-C cable.

[env:xiao_c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
